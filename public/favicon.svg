<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#141414" />
  <!-- P Stem (Vertical line) -->
  <line x1="36" y1="20" x2="36" y2="82" stroke="#F2F0EB" stroke-width="4.5" stroke-linecap="square" />
  <!-- P Bowl (Top Curved Loop) -->
  <path d="M 36 20 H 62 C 74 20 74 54 62 54 H 36" fill="none" stroke="#F2F0EB" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter" />
  <!-- Piercing Arrow Line (Diagonal) -->
  <line x1="28" y1="72" x2="78" y2="28" stroke="#F2F0EB" stroke-width="4" stroke-linecap="round" />
  <!-- Arrowhead Head (Pointing top-right) -->
  <path d="M 64 28 H 78 V 42" fill="none" stroke="#F2F0EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
